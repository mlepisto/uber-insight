name: Scrape Kahului cruise schedule

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month to fetch (YYYY-MM), recon only"
        required: false
        default: "2026-11"
      recon:
        description: "Recon mode (1 = dump HTML to log, blank = parse+commit)"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run scraper
        env:
          MONTH: ${{ inputs.month }}
          RECON: ${{ inputs.recon }}
        run: node scripts/cruise-scrape.mjs
      - name: Commit if changed
        if: ${{ inputs.recon == '' }}
        run: |
          git config user.name "ogg-cruise-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cruise.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "data: refresh Kahului cruise schedule"; git push; fi
