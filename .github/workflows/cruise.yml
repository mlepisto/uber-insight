name: Scrape Kahului cruise schedule

on:
  schedule:
    - cron: "0 12 * * 1"   # weekly, Monday 12:00 UTC (02:00 HST)
  workflow_dispatch:
    inputs:
      recon:
        description: "1 = dump HTML to log instead of writing"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: cruise-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Scrape
        env:
          RECON: ${{ inputs.recon }}
        run: node scripts/cruise-scrape.mjs
      - name: Commit if changed
        if: ${{ inputs.recon == '' }}
        run: |
          git config user.name "ogg-cruise-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cruise.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "data: refresh Kahului cruise schedule"; git push; fi
