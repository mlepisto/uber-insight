name: Daily OGG email brief

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 05:00 HST daily
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = preview in log, do not send"
        required: false
        default: ""

permissions:
  contents: write   # to commit the refreshed flight-week cache

concurrency:
  group: email-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build & send brief
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          DRY: ${{ inputs.dry }}
        run: node scripts/email-brief.mjs
      - name: Commit refreshed flight cache
        run: |
          git config user.name "ogg-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flights-week.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no cache change"; else git commit -m "data: refresh 7-day flight cache"; git push; fi
