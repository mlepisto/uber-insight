name: Refresh OGG arrivals

on:
  # OPTIONAL / DORMANT. The app is live client-side (your browser calls the API with your
  # own key), so this server-side refresh is off by default. Only turn it on if you want the
  # public URL to show live data to people who DON'T have a key. To enable: add an
  # AERODATABOX_KEY repo secret, then uncomment the schedule below.
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-ogg
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull live arrivals
        env:
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
        run: node scripts/refresh.mjs
      - name: Commit if changed
        run: |
          git config user.name "ogg-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flights.json
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "data: refresh OGG arrivals"
            git push
          fi
