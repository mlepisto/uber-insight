name: Daily OGG pull + email

on:
  schedule:
    # 14:35 UTC = 04:35 HST. Off the congested :00 slot and a bit early to buffer
    # GitHub's scheduled-run delay (cron here is best-effort, not punctual).
    - cron: "35 14 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = compose email but don't send (preview in log)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull flight schedule (rolling 5 days, today fresh)
        env:
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
        run: node scripts/flights.mjs

      - name: Commit refreshed schedule
        run: |
          if [ ! -f data/flights.json ]; then echo "no flights.json (no key yet) — skipping commit"; exit 0; fi
          git config user.name "ogg-flights-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flights.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "data: refresh OGG flight schedule"; git push; fi

      - name: Build & send daily email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          DRY: ${{ inputs.dry }}
        run: node scripts/email-brief.mjs
